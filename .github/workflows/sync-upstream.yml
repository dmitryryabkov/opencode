name: sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Canonical OpenCode branch or tag to sync"
        required: true
        default: dev
      auto_merge:
        description: "Merge the sync PR automatically when GitHub allows it"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: sync upstream branch
    runs-on: ubuntu-latest
    env:
      BASE_REF: dev
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev' }}
      UPSTREAM_REPOSITORY: anomalyco/opencode
      AUTO_MERGE: ${{ github.event_name == 'schedule' || github.event.inputs.auto_merge == 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0

      - name: Merge upstream
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_REF}"

          sync_branch="upstream-sync/${UPSTREAM_REF//\//-}"
          git switch --force-create "${sync_branch}" "origin/${BASE_REF}"

          if ! git merge --no-edit --no-ff FETCH_HEAD; then
            echo "::error::Upstream ${UPSTREAM_REPOSITORY}:${UPSTREAM_REF} conflicts with ${BASE_REF}. Resolve locally and push the result."
            git status --short
            exit 1
          fi

          # This fork owns its GitHub metadata. Keep upstream workflow and issue
          # automation out of sync branches so GITHUB_TOKEN does not need the
          # workflow scope and the fork does not re-enable upstream automation.
          git restore --source "origin/${BASE_REF}" --staged --worktree .github

          if git diff --quiet "origin/${BASE_REF}..HEAD"; then
            echo "No upstream changes to sync."
            exit 0
          fi

          git push --force-with-lease origin "${sync_branch}"

          pr_body="Merge ${UPSTREAM_REPOSITORY}:${UPSTREAM_REF} into this fork's ${BASE_REF} branch."
          pr_url="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${sync_branch}?expand=1"

          if gh pr view "${sync_branch}" >/dev/null 2>&1; then
            if gh pr edit "${sync_branch}" --base "${BASE_REF}" --title "Sync upstream ${UPSTREAM_REF}" --body "${pr_body}"; then
              pr_number="$(gh pr view "${sync_branch}" --json number --jq .number)"
              pr_url="$(gh pr view "${sync_branch}" --json url --jq .url)"
            else
              echo "::warning::Updated ${sync_branch}, but GitHub blocked updating the pull request."
              echo "Open or update the pull request manually: ${pr_url}"
              exit 0
            fi
          elif gh pr create \
            --base "${BASE_REF}" \
            --head "${sync_branch}" \
            --title "Sync upstream ${UPSTREAM_REF}" \
            --body "${pr_body}"; then
            pr_number="$(gh pr view "${sync_branch}" --json number --jq .number)"
            pr_url="$(gh pr view "${sync_branch}" --json url --jq .url)"
          else
            echo "::warning::Updated ${sync_branch}, but GitHub blocked creating the pull request."
            echo "Open the pull request manually: ${pr_url}"
            {
              echo "### Upstream sync branch pushed"
              echo ""
              echo "GitHub blocked this workflow from creating the pull request."
              echo ""
              echo "- Branch: \`${sync_branch}\`"
              echo "- Base: \`${BASE_REF}\`"
              echo "- Manual PR: ${pr_url}"
              echo ""
              echo "To allow automatic PR creation, enable **Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests**."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ "${AUTO_MERGE}" != "true" ]; then
            echo "Upstream sync PR ready: ${pr_url}"
            exit 0
          fi

          if gh pr merge "${pr_number}" --merge --delete-branch; then
            echo "Merged upstream sync PR: ${pr_url}"
            exit 0
          fi

          echo "::warning::Upstream sync PR is ready, but GitHub blocked automatic merge."
          echo "Merge manually with a merge commit: ${pr_url}"
          {
            echo "### Upstream sync PR ready"
            echo ""
            echo "GitHub blocked this workflow from automatically merging the pull request."
            echo ""
            echo "- PR: ${pr_url}"
            echo "- Merge mode: merge commit"
            echo ""
            echo "Check branch protection, required checks, and workflow permissions if you want the workflow to merge it automatically."
          } >> "${GITHUB_STEP_SUMMARY}"
